<!DOCTYPE html>
<html>
<head>
    <title>IoT Dashboard MongoDB</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            text-align: center;
        }

        canvas {
            background: white;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h2>IoT MongoDB Dashboard</h2>

    <h3>🌡 Temp: <span id="t">--</span></h3>
    <h3>💧 Humi: <span id="h">--</span></h3>

    <canvas id="chart"></canvas>

    <script>
        const socket = io("https://YOUR-RAILWAY.up.railway.app");

        const tEl = document.getElementById("t");
        const hEl = document.getElementById("h");

        const chart = new Chart(document.getElementById("chart"), {
            type: "line",
            data: {
                labels: [],
                datasets: [
                    { label: "Temp", data: [], borderColor: "red" },
                    { label: "Humi", data: [], borderColor: "blue" }
                ]
            }
        });

        // 📥 load lịch sử MongoDB
        fetch("https://YOUR-RAILWAY.up.railway.app/history")
            .then(res => res.json())
            .then(data => {
                data.forEach(d => {
                    chart.data.labels.push(new Date(d.time).toLocaleTimeString());
                    chart.data.datasets[0].data.push(d.temp);
                    chart.data.datasets[1].data.push(d.humi);
                });
                chart.update();
            });

        // 🔴 realtime
        socket.on("sensor", (data) => {
            tEl.innerText = data.temp;
            hEl.innerText = data.humi;

            const time = new Date().toLocaleTimeString();

            chart.data.labels.push(time);
            chart.data.datasets[0].data.push(data.temp);
            chart.data.datasets[1].data.push(data.humi);

            if (chart.data.labels.length > 10) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
                chart.data.datasets[1].data.shift();
            }

            chart.update();
        });
    </script>

</body>
</html>
