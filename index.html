<!DOCTYPE html>
<html>
<head>
    <title>IoT Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        .card {
            background: #1e293b;
            margin: 10px auto;
            padding: 20px;
            width: 300px;
            border-radius: 10px;
        }

        table {
            width: 90%;
            margin: auto;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            padding: 8px;
            border: 1px solid #555;
        }
    </style>
</head>

<body>

    <h1>🌐 IoT Dashboard</h1>

    <div class="card">
        <h2 id="temp">Temp: --</h2>
        <h2 id="humi">Humi: --</h2>
        <h2 id="light">Light: --</h2>
    </div>

    <canvas id="chart" width="400" height="200"></canvas>

    <h2>Logs</h2>

    <table>
        <thead>
            <tr>
                <th>Device</th>
                <th>Temp</th>
                <th>Humi</th>
                <th>Light</th>
                <th>Time</th>
            </tr>
        </thead>
        <tbody id="logTable"></tbody>
    </table>

    <script>
        const ctx = document.getElementById("chart").getContext("2d");

        const chart = new Chart(ctx, {
            type: "line",
            data: {
                labels: [],
                datasets: [
                    { label: "Temp", data: [], borderColor: "red" },
                    { label: "Humi", data: [], borderColor: "blue" },
                    { label: "Light", data: [], borderColor: "yellow" }
                ]
            }
        });

        async function loadData() {
            const res = await fetch("/data");
            const d = await res.json();

            if (!d) return;

            document.getElementById("temp").innerText = "Temp: " + d.temp;
            document.getElementById("humi").innerText = "Humi: " + d.humi;
            document.getElementById("light").innerText = "Light: " + d.light;

            const time = new Date().toLocaleTimeString();

            chart.data.labels.push(time);
            chart.data.datasets[0].data.push(d.temp);
            chart.data.datasets[1].data.push(d.humi);
            chart.data.datasets[2].data.push(d.light);

            if (chart.data.labels.length > 10) {
                chart.data.labels.shift();
                chart.data.datasets.forEach(ds => ds.data.shift());
            }

            chart.update();
        }

        async function loadLogs() {
            const res = await fetch("/logs");
            const logs = await res.json();

            const table = document.getElementById("logTable");
            table.innerHTML = "";

            logs.forEach(l => {
                table.innerHTML += `
          <tr>
            <td>${l.device}</td>
            <td>${l.temp}</td>
            <td>${l.humi}</td>
            <td>${l.light}</td>
            <td>${new Date(l.time).toLocaleString()}</td>
          </tr>
        `;
            });
        }

        setInterval(() => {
            loadData();
            loadLogs();
        }, 2000);
    </script>

</body>
</html>
